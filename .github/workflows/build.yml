name: Build help

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Screenshot markup falls back to DejaVu Sans when Segoe UI is unavailable.
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python tools/build.py --zip
      - run: sha256sum opennest-help.zip > opennest-help.zip.sha256
        working-directory: dist
      - uses: actions/upload-artifact@v4
        with:
          name: opennest-help
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opennest-help
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/opennest-help.zip dist/opennest-help.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Help site for OpenNest. Pin this tag and SHA-256 in OpenNest's scripts/help.json."
        env:
          GH_TOKEN: ${{ github.token }}
