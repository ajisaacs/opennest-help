site_name: OpenNest Help
site_description: How to use OpenNest, the CNC nesting application.
copyright: OpenNest

# The desktop app serves the built site from a local virtual host and links to
# page files directly, so pages must be plain `name.html` files.
use_directory_urls: false
strict: true

theme:
  name: material
  # Shop-floor PCs may be offline: never fetch fonts from Google.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  # Lets the site work from file:// too (search included), e.g. opened from a share.
  - offline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences

extra_css:
  - css/help.css

nav:
  - Home: index.md
  - Getting started:
      - Your first nest: first-nest.md
  - Guides:
      - CAD Converter: cad-converter.md
      - Auto Nest: auto-nest.md
      - Plan the cutting: cutting-planner.md
      - Trim and extend cut-offs: trim-extend-cutoff.md
      - Check a nest: validate.md
      - Edit a plate by hand: edit-plates.md
      - Cut order and simulation: sequencing.md
  - Setting up:
      - Machines: machines.md
      - Nest settings: nest-settings.md
  - Shared server:
      - Shared nest server: nest-server.md
      - Drawing Library: drawing-library.md
      - Drawing sets: drawing-sets.md
      - Releases: releases.md
